<article class="story">
  $banner
  <header class="story-head">
    <p class="kicker">$section $series</p>
    <h1>$title</h1>
    <p class="story-dek">$dek</p>
    <p class="byline">By <strong>$author</strong> · <time datetime="$date_iso">$date</time> · $minutes min read · <span class="issue">$issue</span></p>
  </header>
  <div class="story-body">
$body
  </div>
  <footer class="story-foot">
    <section>
      <h2 class="rule-label">Data</h2>
      <ul>$sources</ul>
    </section>
    <section>
      <h2 class="rule-label">Code</h2>
      <ul>$code</ul>
    </section>
  </footer>
  <p class="back"><a href="${root}index.html">← All signals</a></p>
</article>
