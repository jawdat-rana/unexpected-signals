# Raw-data fetches for this dataset, run by the `fetch` workflow
# (see .github/scripts/fetch_plan.py). Run by hand on 3 January to add the
# night that just passed: gh workflow run fetch -f name=fireworks

[[fetch]]
name = "fireworks"
run = "python -u analysis/fireworks-air/fetch_raw.py raw"
watch = ["analysis/fireworks-air/fetch_raw.py"]
# Keep earlier seasons; the script only refetches unvalidated or newest ones.
keep = true
timeout = 90
summary = "manifest.csv"

# One-off check of the API path used for the newest week (prints only).
[[fetch]]
name = "fireworks-apicheck"
run = "python -u analysis/fireworks-air/check_api.py"
watch = ["analysis/fireworks-air/check_api.py"]
timeout = 15
