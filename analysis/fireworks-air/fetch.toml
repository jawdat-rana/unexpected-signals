# Raw-data fetches for this dataset, run by the `fetch` workflow
# (see .github/scripts/fetch_plan.py). Run by hand on 1 January to add the
# night that just passed: gh workflow run fetch -f name=fireworks

[[fetch]]
name = "fireworks"
run = "python -u analysis/fireworks-air/explore.py"
watch = ["analysis/fireworks-air/fetch_raw.py", "analysis/fireworks-air/explore.py"]
keep = true
timeout = 10
