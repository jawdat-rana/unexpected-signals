title = "Borders drawn through people"
dek = "Africa's colonial borders are famous for cutting peoples in two. I put a world map of ethnic groups over today's borders to see if Africa is the exception. It isn't: South America comes second, and the border that cuts the most peoples runs between Canada and the United States."
