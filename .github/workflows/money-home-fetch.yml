name: money-home-fetch

# Downloads and pre-filters the FEC files for "Money in politics, part 2: the
# home front" and commits them to the `raw-money-home` branch.

on:
  push:
    paths:
      - "analysis/money-in-politics/fetch_home_front.py"
      - "analysis/money-in-politics/home_front_committees.csv"
      - ".github/workflows/money-home-fetch.yml"
  workflow_dispatch:

# Both raw-money-home workflows push to the same branch, so run one at a time.
concurrency:
  group: raw-money-home
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and filter sources
        run: |
          # Keep the earmark totals that money-home-earmarks adds to the branch.
          if git fetch -q origin raw-money-home; then
            git worktree add -B raw-money-home raw FETCH_HEAD
          else
            git worktree add --orphan -b raw-money-home raw
          fi
          python analysis/money-in-politics/fetch_home_front.py raw
          rm -rf raw/_tmp
          cat raw/manifest.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Push to raw-money-home
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Data unchanged, nothing to commit"; exit 0; fi
          git commit -q -m "raw: home front sources $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:raw-money-home
