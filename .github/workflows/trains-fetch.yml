name: trains-fetch

# Downloads the raw sources for the train stories (Rijden de Treinen
# disruptions and the NS annual report dashboard) and commits them to the
# `raw-trains` branch, so the analysis can run anywhere without re-fetching.

on:
  push:
    paths: ["analysis/train-disruptions/fetch_raw.py", ".github/workflows/trains-fetch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sources
        run: |
          git worktree add --orphan -b raw-trains raw
          python analysis/train-disruptions/fetch_raw.py raw | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to raw-trains
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "raw: train sources $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:raw-trains
