name: housing-fetch

# Downloads the CBS StatLine tables for the housing story (see
# analysis/who-owns-homes/tables.txt) and commits them to the `raw-housing`
# branch, so the analysis can run anywhere without re-fetching.

on:
  push:
    paths:
      - "analysis/who-owns-homes/fetch_raw.py"
      - "analysis/who-owns-homes/tables.txt"
      - ".github/workflows/housing-fetch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sources
        run: |
          git worktree add --orphan -b raw-housing raw
          python -u analysis/who-owns-homes/fetch_raw.py raw | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push to raw-housing
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "raw: CBS housing tables $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:raw-housing
