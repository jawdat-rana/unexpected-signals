name: probe-new-feeds
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml", "src/**", "config.toml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run (nothing is committed)
        env:
          PYTHONPATH: src
        run: |
          for f in parking apple_charts google_trending ovfiets netflix_top10; do
            time python -m unexpected_signals collect --out /tmp/out --only $f || true
          done
          sleep 60
          python -m unexpected_signals collect --out /tmp/out --only parking --only ovfiets || true
          find /tmp/out -type f -exec ls -l {} \; | awk '{print $5, $9}'
          for f in $(find /tmp/out -name '*.csv' | grep -v netflix); do echo "== $f"; head -4 "$f"; wc -l < "$f"; done
          head -12 /tmp/out/google_trending/*/*/*.csv | cut -c1-200
          grep -c ',nl,apps-free,' /tmp/out/apple_charts/*/*/*.csv
          grep ',nl,apps-free,' /tmp/out/apple_charts/*/*/*.csv | head -15
          grep ',nl,songs,' /tmp/out/apple_charts/*/*/*.csv | head -5
          awk -F, '$4=="True"' /tmp/out/parking/*/*/*.csv | wc -l
          python - <<'PY'
          import csv,glob,datetime
          rows=list(csv.DictReader(open(glob.glob('/tmp/out/parking/*/*/*.csv')[0])))
          now=datetime.datetime.now(datetime.UTC)
          ages=sorted((now-datetime.datetime.fromisoformat(r['last_updated'].replace('Z','+00:00'))).total_seconds()/3600 for r in rows if r['last_updated'][:2]=='20')
          print('parking freshness hours, quantiles:', [round(ages[int(q*(len(ages)-1))],2) for q in (0,.25,.5,.75,.9,1)], len(ages))
          cat=list(csv.DictReader(open('/tmp/out/parking_catalogue.csv')))
          from collections import Counter
          print(Counter(c['city'] for c in cat).most_common(20))
          PY
