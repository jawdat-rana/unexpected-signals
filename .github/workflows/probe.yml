name: probe-tiktok
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: python
        run: |
          import urllib.request, gzip
          H = {"User-Agent": "unexpected-signals/0.1 (+https://github.com/jawdat-rana/unexpected-signals)"}
          for u in ["https://www.shazam.com/services/charts/csv/top-200/netherlands",
                    "https://www.shazam.com/services/charts/csv/top-200/world",
                    "https://www.shazam.com/charts/top-200/netherlands",
                    "https://www.billboard.com/charts/tiktok-billboard-top-50/"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30); b = r.read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  t = b.decode("utf-8", "replace")
                  print(f"\n===== {u} -> {r.status} {len(b)} {r.headers.get('content-type')}"); print(t[:900])
              except Exception as e:
                  print(f"\n===== {u} -> ERROR {e!r}")
