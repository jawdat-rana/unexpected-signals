name: probe-tiktok
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > p.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ locale: 'en-US' });
            p.on('response', async r => {
              const u = r.url();
              if (u.includes('creative_radar_api') || u.includes('popular_trend')) {
                let t = ''; try { t = await r.text(); } catch (e) {}
                console.log('API', r.status(), u.slice(0, 250)); console.log(t.slice(0, 1500));
              }
            });
            for (const cc of ['NL', 'US']) {
              await p.goto(`https://ads.tiktok.com/business/creativecenter/inspiration/popular/music/pc/en?countryCode=${cc}&period=7`, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => console.log('goto', e.message));
              await p.waitForTimeout(8000);
              console.log('URL', p.url());
              const txt = await p.evaluate(() => document.body.innerText.slice(0, 1500));
              console.log('TEXT', cc, txt.replace(/\n+/g, ' | '));
            }
            await b.close();
          })();
          JS
          node p.js
