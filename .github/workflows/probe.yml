name: probe-shazam
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml", "src/**", "config.toml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run (nothing is committed)
        env:
          PYTHONPATH: src
        run: |
          python -m unexpected_signals collect --out /tmp/out --only shazam
          f=$(ls /tmp/out/shazam/*/*/*.csv); ls -l $f
          for c in netherlands belgium germany united-kingdom united-states world; do echo "== $c"; grep ",$c," $f | head -4; done
          for u in amsterdam rotterdam; do curl -s -o /dev/null -w "city $u %{http_code}\n" https://www.shazam.com/services/charts/csv/top-200/netherlands/$u; done
          curl -s https://www.shazam.com/services/charts/csv/top-50/netherlands/amsterdam | head -6
