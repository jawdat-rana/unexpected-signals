name: probe-new-feeds
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: python
        run: |
          import json, urllib.request, gzip
          UA = {"User-Agent": "unexpected-signals/0.1 (+https://github.com/jawdat-rana/unexpected-signals)"}
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30)
                  b = r.read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  print(f"\n===== {u} -> {r.status} {len(b)} bytes {r.headers.get('content-type')}")
                  return b
              except Exception as e:
                  print(f"\n===== {u} -> ERROR {e!r}")
                  return b""
          from concurrent.futures import ThreadPoolExecutor
          from collections import Counter
          import time
          d = json.loads(get("http://fiets.openov.nl/locaties.json"))
          locs = d["locaties"]; print(len(locs), "locations", list(d.keys()))
          k = next(iter(locs)); r = dict(locs[k]); r.pop("infoImages", None); r.pop("openingHours", None)
          print(json.dumps(r, indent=1)[:3000])
          fac = json.loads(get("https://npropendata.rdw.nl/parkingdata/v2/"))["ParkingFacilities"]
          dyn = [f for f in fac if f.get("dynamicDataUrl")]
          print(Counter(f.get("limitedAccess") for f in dyn))
          def fetch(f):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(f["dynamicDataUrl"], headers=UA), timeout=20)
                  return ("ok", json.loads(r.read()))
              except Exception as e:
                  return (repr(e)[:40], None)
          t=time.time()
          with ThreadPoolExecutor(16) as ex: res = list(ex.map(fetch, dyn))
          print("fetched in", round(time.time()-t,1), "s", Counter(r[0] for r in res))
          now=time.time()
          ages=[now-r[1]["parkingFacilityDynamicInformation"]["facilityActualStatus"].get("lastUpdated",0) for r in res if r[0]=="ok"]
          ages.sort(); print("age quantiles h", [round(ages[int(q*(len(ages)-1))]/3600,1) for q in (0,.25,.5,.75,.9,1)])
          okf=[f for f,r in zip(dyn,res) if r[0]=="ok"]
          print(json.dumps(okf[0])[:500])
          st=json.loads(get(okf[0]["staticDataUrl"]))["parkingFacilityInformation"]
          print(list(st.keys()))
          print(json.dumps({k:v for k,v in st.items() if k not in ("operator","contactPersons","openingTimes","tariffs","paymentMethods")}, indent=1)[:2500])
