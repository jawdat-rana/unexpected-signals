name: probe-new-feeds
on:
  push:
    branches: [claude/project-thread-31so5g]
    paths: [".github/workflows/probe.yml", "src/**", "config.toml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry run (nothing is committed)
        env:
          PYTHONPATH: src
        run: |
          for i in 1 2 3; do python -m unexpected_signals collect --out /tmp/out --only netflix_top10; done
          wc -l /tmp/out/netflix_top10/*/*.csv
