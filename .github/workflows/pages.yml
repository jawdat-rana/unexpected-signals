name: pages

# Builds the site from stories/ and publishes it to GitHub Pages.
# Pull requests build too (with drafts), so a broken story fails before merge.
# A daily run puts "ready" stories live on their date (see newsroom/build.py)
# and writes the newsroom list to the run summary.
# One-time setup: Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    paths: ["stories/**", "templates/**", "newsroom/**", ".github/workflows/pages.yml"]
  schedule:
    # 05:17 UTC is 06:17 in Amsterdam in winter (07:17 in summer). GitHub can
    # start scheduled runs late, so this aims well before the morning.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown>=3.6"
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python newsroom/build.py build --drafts
          else
            python newsroom/build.py build
          fi
      - name: Newsroom list
        run: |
          {
            echo "## Newsroom, $(date -u +%F)"
            echo
            python newsroom/build.py schedule
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
