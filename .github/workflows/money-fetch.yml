name: money-fetch

# Downloads the raw sources for the "Money in politics" series and commits
# them to the `raw-money` branch, so they can be inspected without re-fetching.

on:
  push:
    paths: ["analysis/money/fetch_raw.py", ".github/workflows/money-fetch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download sources
        run: |
          git worktree add --orphan -b raw-money raw
          python analysis/money/fetch_raw.py raw
          cat raw/manifest.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Push to raw-money
        working-directory: raw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "raw: money sources $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:raw-money
