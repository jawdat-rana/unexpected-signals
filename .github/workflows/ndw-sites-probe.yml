name: ndw-sites-probe
# Temporary: prints the structure of NDW's measurement-site file so the site
# catalogue parser can be written. Removed before merge.
on:
  push:
    branches: [claude/project-thread-wudcqc]
    paths: [.github/workflows/ndw-sites-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in snelheden_en_intensiteiten_configuratie_meetlocaties.xml.gz measurement_current.xml.gz measurement.xml.gz; do
            echo "=== $f"; curl -sSI "https://opendata.ndw.nu/$f" | head -5
          done
          curl -sSL -o cfg.xml.gz https://opendata.ndw.nu/snelheden_en_intensiteiten_configuratie_meetlocaties.xml.gz
          ls -la cfg.xml.gz; gunzip -f cfg.xml.gz; ls -la cfg.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, collections, re
          loc=lambda t:t.rsplit('}',1)[-1]
          raw=open('cfg.xml','rb').read()
          print(raw[:1500].decode('utf-8','replace'))
          tags=collections.Counter(); n=0; shown=0
          for ev,el in ET.iterparse('cfg.xml',events=('end',)):
              tags[loc(el.tag)]+=1
              if loc(el.tag) in ('measurementSiteRecord','measurementSite','MeasurementSite'):
                  n+=1
                  if shown<3 and (n in (1,5000,12000)):
                      shown+=1
                      s=ET.tostring(el,encoding='unicode'); s=re.sub(r'xmlns(:\w+)?="[^"]*"','',s)
                      print('----- record',n,len(s)); print(s[:6000])
                  el.clear()
          print('records',n); print(tags.most_common(80))
          PY
