name: ndw-sites-probe
# Temporary: builds the site catalogue from live NDW data and runs the
# watchlist picker on it. Removed before merge.
on:
  push:
    branches: [claude/project-thread-wudcqc]
    paths: [.github/workflows/ndw-sites-probe.yml, src/unexpected_signals/*.py, analysis/traffic-watchlist/*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git fetch --depth 1 origin data
          git worktree add data-branch FETCH_HEAD
      - env:
          PYTHONPATH: src
        run: |
          sed -i 's/^\[traffic\]/[traffic]\ncatalogue_url = "https:\/\/opendata.ndw.nu\/snelheden_en_intensiteiten_configuratie_meetlocaties.xml.gz"/' config.toml
          python -m unexpected_signals collect --only traffic --out data-branch/data
          python - <<'PY'
          import csv, collections
          rows=list(csv.DictReader(open('data-branch/data/traffic_sites_catalogue.csv')))
          print('catalogue',len(rows),'with road',sum(bool(r['road']) for r in rows))
          print(collections.Counter(r['road'][:1] for r in rows))
          PY
          tail -n 50 data-branch/data/traffic_roads/*/*/*.csv
          python analysis/traffic-watchlist/pick.py data-branch/data
          cat analysis/traffic-watchlist/watchlist.csv
