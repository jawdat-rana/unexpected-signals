# Story metadata. The build reads this file; it is not published.

title = "Headline goes here"
# One sentence that tells the reader what they will learn.
dek = "The template every story starts from. It uses every component, so it doubles as the style guide."
date = 2026-11-05
# Short label above the headline: Trains, Roads, Money, Energy, Water...
section = "Style guide"
# Optional: the series this belongs to, like "Money in politics, part 1".
series = ""
# The date the story goes live, or went live.
# draft: being written, preview only (build --drafts).
# ready: signed off. Goes live by itself on `date`, unless `open` has items,
#        story.md still has ⟨…⟩ / TODO marks, or the story in `after` isn't live.
# published: live now.
status = "draft"
# Open questions or actions that must be settled first. Empty the list when done.
open = []
# Optional: slug of a story that must go live first, like "boats-go-first".
after = ""
# Optional, after publishing: the date of a later change, shown in the byline,
# and one sentence on what changed, shown above the text.
# updated = 2026-12-14
# update_note = "Final 2026 numbers from the post-general FEC reports."
tags = []
# Share image for LinkedIn previews, 1200 x 627, inside this folder. Optional.
image = ""
# Folder with the Python that made the chart data.
analysis = ""

[[sources]]
name = "Example data, made up for this template"
url = "https://github.com/jawdat-rana/unexpected-signals/tree/main/templates/story/data"
licence = "CC0"
